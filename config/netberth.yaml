# NetBerth Configuration
server:
  host: 0.0.0.0
  port: 8443
  read_timeout: 30s
  write_timeout: 30s
  read_header_timeout: 5s  # slowloris defense
  idle_timeout: 120s       # keep-alive idle cap
  max_header_bytes: 65536  # 64KB request header cap (yaml only)
  rate_limit_rate: 100     # NB_RATE_LIMIT_RATE — per-IP tokens/sec
  rate_limit_burst: 200    # NB_RATE_LIMIT_BURST — per-IP burst
  trusted_proxies: []      # NB_TRUSTED_PROXIES — e.g. "10.0.0.1,192.168.1.0/24"
  tls_enabled: false # NB_TLS_ENABLED — serve the admin panel over HTTPS
  tls_cert: ""       # NB_TLS_CERT — optional PEM cert path
  tls_key: ""        # NB_TLS_KEY — optional PEM key path

database:
  path: ./data/netberth.db # NB_DB_PATH
  driver: sqlite           # NB_DB_DRIVER — sqlite (default) or postgres
  dsn: ""                  # NB_DB_DSN — postgres://user:pass@host:5432/netberth

auth:
  jwt_secret: "" # Set via NB_JWT_SECRET env var
  access_token_expiry: 15m
  refresh_token_expiry: 168h
  session_max_age: 24h

log:
  level: info
  format: json
