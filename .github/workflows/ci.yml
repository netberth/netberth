name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Extra GHCR image tag (e.g. v1.3.0)'
        required: false
        type: string

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - run: go mod tidy
      - run: go vet ./...
      - run: go test -short -v -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: go build -o netberth ./cmd/netberth

  frontend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: cd web && npm ci --ignore-scripts --no-audit --no-fund
      - run: cd web && npm audit --omit=dev --audit-level=high

  docker:
    needs: backend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t netberth:latest .
      - name: Test health check
        run: |
          docker run -d --name netberth-test -p 8443:8443 \
            -e NB_JWT_SECRET=ci-test-secret-do-not-use \
            -v /tmp/nh-data:/app/data \
            netberth:latest
          sleep 5
          curl -sf --retry 10 --retry-delay 2 http://localhost:8443/api/v1/system/status
          docker stop netberth-test

  # publish: manual-only until DOCKER_USERNAME/DOCKER_PASSWORD secrets
  # are configured. Trigger via Actions → Run workflow.
  publish:
    needs: docker
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Check Docker Hub secrets
        id: dh
        env:
          DH_USER: ${{ secrets.DOCKER_USERNAME }}
          DH_PASS: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -n "$DH_USER" ] && [ -n "$DH_PASS" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "DOCKER_USERNAME/DOCKER_PASSWORD not set; Docker Hub publish skipped"
          fi
      - name: Log in to Docker Hub
        if: steps.dh.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        if: steps.dh.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            netberth/netberth:${{ github.ref_name }}
            netberth/netberth:latest

  # GHCR needs no repository secrets: GITHUB_TOKEN has package write access.
  ghcr:
    needs: docker
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/netberth/netberth:${{ inputs.version != '' && inputs.version || (github.ref_type == 'tag' && github.ref_name || 'main') }}
            ghcr.io/netberth/netberth:latest
